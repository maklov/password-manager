version: '3.8'

services:
  api:
    build:
      context: ..
      dockerfile: .docker/Dockerfile
    container_name: fastapi-backend
    restart: unless-stopped
    expose:
      - "8000"
    env_file:
      - ../.env
    networks:
      - web

  caddy:
    build:
      context: .
      dockerfile: Dockerfile.caddy
    container_name: caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    depends_on:
      - api

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
    driver: bridge